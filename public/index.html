<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MicBlox</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 20% 10%,
            #243b63 0%,
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 90%,
            #183d35 0%,
            transparent 35%
        ),
        #070a10;

    color: white;

    font-family:
        Arial,
        sans-serif;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;
}

.card {

    width: 460px;
    max-width: 100%;

    background:
        rgba(15, 19, 28, .92);

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius: 28px;

    padding: 26px;

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.55);

    backdrop-filter:
        blur(20px);
}

.logo {
    text-align: center;
    font-size: 32px;
    font-weight: 900;
}

.subtitle {
    text-align: center;
    color: #7e8798;
    margin-top: 6px;
    margin-bottom: 22px;
}

.status {

    display: flex;
    align-items: center;
    gap: 8px;

    background: #101620;

    border-radius: 14px;

    padding: 12px 14px;

    margin-bottom: 15px;

    color: #9da6b7;
}

.dot {

    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: #ff4141;

}

.dot.online {
    background: #39e58b;
    box-shadow:
        0 0 14px
        rgba(57,229,139,.8);
}

.linkBox {

    background: #101620;

    border-radius: 16px;

    padding: 13px;

    margin-bottom: 15px;
}

.linkTitle {
    color: #8e98aa;
    font-size: 12px;
    margin-bottom: 8px;
}

.linkRow {

    display: flex;
    gap: 8px;
}

#link {

    flex: 1;

    min-width: 0;

    background: #080c13;

    border: 1px solid #202838;

    color: #dfe5ef;

    border-radius: 10px;

    padding: 11px;

    direction: ltr;

    font-size: 12px;
}

button {

    border: 0;

    cursor: pointer;

    font-weight: bold;
}

.copy {

    background: #39e58b;

    color: #06130b;

    border-radius: 10px;

    padding: 0 15px;
}

.mic {

    width: 100%;

    padding: 17px;

    border-radius: 16px;

    background: #35e27c;

    color: #06130b;

    font-size: 17px;

    margin-bottom: 18px;
}

.mic.off {

    background: #ff4d5d;

    color: white;
}

.players {

    background: #101620;

    border-radius: 18px;

    padding: 15px;
}

.title {

    display: flex;

    justify-content: space-between;

    margin-bottom: 12px;
}

.title span {
    color: #7e8798;
    font-size: 13px;
}

.player {

    display: flex;

    justify-content: space-between;

    align-items: center;

    background: #080d14;

    border-radius: 13px;

    padding: 12px;

    margin-top: 8px;
}

.playerInfo {
    display: flex;
    align-items: center;
    gap: 10px;
}

.avatar {

    width: 40px;
    height: 40px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #1b2432;

    border-radius: 50%;
}

.name {
    font-weight: bold;
}

.voice {
    font-size: 20px;
}

.empty {

    text-align: center;

    color: #707a8c;

    padding: 20px;
}

#error {

    color: #ff5964;

    text-align: center;

    margin-top: 12px;

    font-size: 13px;
}

</style>

</head>

<body>

<div class="card">

    <div class="logo">
        🎙️ MicBlox
    </div>

    <div class="subtitle">
        نظام المحادثة الصوتية
    </div>

    <div class="status">

        <div
            id="dot"
            class="dot"
        ></div>

        <span id="connection">
            جاري الاتصال...
        </span>

    </div>

    <div class="linkBox">

        <div class="linkTitle">
            رابط المايك الخاص بك
        </div>

        <div class="linkRow">

            <input
                id="link"
                readonly
            >

            <button
                class="copy"
                id="copy"
            >
                نسخ
            </button>

        </div>

    </div>

    <button
        class="mic"
        id="mic"
    >
        🎙️ تشغيل المايك
    </button>

    <div class="players">

        <div class="title">

            <b>
                اللاعبين
            </b>

            <span id="count">
                0
            </span>

        </div>

        <div id="list">

            <div class="empty">
                لا يوجد لاعبين
            </div>

        </div>

    </div>

    <div id="error"></div>

</div>

<script>

const token =
    location.pathname
        .split("/")
        .filter(Boolean)[0];

if (!token) {
    document.body.innerHTML =
        "<h2 style='color:white'>الرابط غير صالح</h2>";
    throw new Error("Missing token");
}

const link =
    document.getElementById("link");

const copy =
    document.getElementById("copy");

const mic =
    document.getElementById("mic");

const connection =
    document.getElementById("connection");

const dot =
    document.getElementById("dot");

const list =
    document.getElementById("list");

const count =
    document.getElementById("count");

const error =
    document.getElementById("error");

link.value =
    location.href;

let socket = null;
let stream = null;
let micEnabled = false;

let localPlayer = null;
let players = new Map();

let peers = new Map();
let audios = new Map();

/* =========================
   COPY
========================= */

copy.onclick = async () => {

    try {

        await navigator.clipboard.writeText(
            location.href
        );

        copy.textContent = "تم النسخ ✓";

        setTimeout(() => {
            copy.textContent = "نسخ";
        }, 1500);

    } catch {

        link.select();
        document.execCommand("copy");

        copy.textContent = "تم النسخ ✓";
    }
};

/* =========================
   SOCKET
========================= */

function connect() {

    const protocol =
        location.protocol === "https:"
            ? "wss:"
            : "ws:";

    socket =
        new WebSocket(
            `${protocol}//${location.host}/ws?token=${encodeURIComponent(token)}`
        );

    socket.onopen = () => {

        connection.textContent =
            "متصل";

        dot.classList.add("online");

        send({
            type: "username",
            username: "Roblox Player"
        });
    };

    socket.onclose = () => {

        connection.textContent =
            "انقطع الاتصال";

        dot.classList.remove("online");

        setTimeout(connect, 2000);
    };

    socket.onerror = () => {

        connection.textContent =
            "خطأ في الاتصال";
    };

    socket.onmessage = async event => {

        let data;

        try {
            data = JSON.parse(event.data);
        } catch {
            return;
        }

        if (data.type === "connected") {

            localPlayer =
                data.player;

            players.set(
                localPlayer.token,
                localPlayer
            );

            render();

            return;
        }

        if (data.type === "peers") {

            for (const player of data.players || []) {

                players.set(
                    player.token,
                    player
                );

                await createPeer(
                    player.token,
                    true
                );
            }

            render();

            return;
        }

        if (data.type === "player_joined") {

            if (!data.player) return;

            players.set(
                data.player.token,
                data.player
            );

            render();

            return;
        }

        if (data.type === "player_update") {

            if (!data.player) return;

            players.set(
                data.player.token,
                data.player
            );

            render();

            return;
        }

        if (data.type === "player_left") {

            removePeer(
                data.token
            );

            players.delete(
                data.token
            );

            render();

            return;
        }

        if (data.type === "positions") {

            for (
                const player of
                data.players || []
            ) {

                players.set(
                    player.token,
                    player
                );
            }

            render();

            return;
        }

        if (data.type === "signal") {

            await handleSignal(
                data.from,
                data.signal
            );
        }
    };
}

connect();

/* =========================
   SEND
========================= */

function send(data) {

    if (
        socket &&
        socket.readyState === WebSocket.OPEN
    ) {
        socket.send(
            JSON.stringify(data)
        );
    }
}

/* =========================
   MIC
========================= */

mic.onclick = async () => {

    error.textContent = "";

    if (!micEnabled) {

        try {

            stream =
                await navigator.mediaDevices
                    .getUserMedia({
                        audio: true
                    });

            micEnabled = true;

            mic.textContent =
                "🔴 إيقاف المايك";

            mic.classList.add("off");

            send({
                type: "mic",
                enabled: true
            });

            for (const pc of peers.values()) {

                for (
                    const track of
                    stream.getTracks()
                ) {

                    pc.addTrack(
                        track,
                        stream
                    );
                }
            }

        } catch (e) {

            console.error(e);

            error.textContent =
                "اسمح للموقع باستخدام الميكروفون.";
        }

    } else {

        disableMic();
    }
};

function disableMic() {

    micEnabled = false;

    if (stream) {

        for (const track of stream.getTracks()) {
            track.stop();
        }

        stream = null;
    }

    mic.textContent =
        "🎙️ تشغيل المايك";

    mic.classList.remove("off");

    send({
        type: "mic",
        enabled: false
    });
}

/* =========================
   WEBRTC
========================= */

async function createPeer(
    remote,
    offer
) {

    if (
        !remote ||
        remote === token
    ) {
        return;
    }

    if (peers.has(remote)) {
        return peers.get(remote);
    }

    const pc =
        new RTCPeerConnection({
            iceServers: [
                {
                    urls:
                        "stun:stun.l.google.com:19302"
                }
            ]
        });

    peers.set(remote, pc);

    if (stream) {

        for (
            const track of
            stream.getTracks()
        ) {

            pc.addTrack(
                track,
                stream
            );
        }
    }

    pc.ontrack = event => {

        let audio =
            audios.get(remote);

        if (!audio) {

            audio =
                document.createElement(
                    "audio"
                );

            audio.autoplay = true;
            audio.playsInline = true;

            document.body.appendChild(
                audio
            );

            audios.set(
                remote,
                audio
            );
        }

        if (event.streams[0]) {
            audio.srcObject =
                event.streams[0];
        }
    };

    pc.onicecandidate = event => {

        if (!event.candidate) return;

        send({
            type: "signal",

            to: remote,

            signal: {
                type: "candidate",
                candidate:
                    event.candidate
            }
        });
    };

    if (offer) {

        const o =
            await pc.createOffer();

        await pc.setLocalDescription(o);

        send({
            type: "signal",

            to: remote,

            signal: {
                type: "offer",
                offer: o
            }
        });
    }

    return pc;
}

/* =========================
   SIGNAL
========================= */

async function handleSignal(
    remote,
    signal
) {

    const pc =
        await createPeer(
            remote,
            false
        );

    if (!pc) return;

    if (signal.type === "offer") {

        await pc.setRemoteDescription(
            signal.offer
        );

        if (stream) {

            for (
                const track of
                stream.getTracks()
            ) {

                const exists =
                    pc.getSenders()
                        .some(
                            sender =>
                                sender.track === track
                        );

                if (!exists) {

                    pc.addTrack(
                        track,
                        stream
                    );
                }
            }
        }

        const answer =
            await pc.createAnswer();

        await pc.setLocalDescription(
            answer
        );

        send({
            type: "signal",

            to: remote,

            signal: {
                type: "answer",
                answer
            }
        });

        return;
    }

    if (signal.type === "answer") {

        await pc.setRemoteDescription(
            signal.answer
        );

        return;
    }

    if (signal.type === "candidate") {

        try {

            await pc.addIceCandidate(
                signal.candidate
            );

        } catch {}
    }
}

/* =========================
   REMOVE PEER
========================= */

function removePeer(id) {

    const pc =
        peers.get(id);

    if (pc) {

        try {
            pc.close();
        } catch {}

        peers.delete(id);
    }

    const audio =
        audios.get(id);

    if (audio) {

        audio.remove();

        audios.delete(id);
    }
}

/* =========================
   UI
========================= */

function render() {

    list.innerHTML = "";

    let amount = 0;

    for (const player of players.values()) {

        if (
            localPlayer &&
            player.token ===
            localPlayer.token
        ) {
            continue;
        }

        amount++;

        const div =
            document.createElement("div");

        div.className = "player";

        div.innerHTML = `
            <div class="playerInfo">
                <div class="avatar">👤</div>
                <div class="name">
                    ${escapeHTML(
                        player.username ||
                        player.user ||
                        "Player"
                    )}
                </div>
            </div>

            <div class="voice">
                ${
                    player.micEnabled
                        ? "🔊"
                        : "🔇"
                }
            </div>
        `;

        list.appendChild(div);
    }

    count.textContent =
        `${amount}`;

    if (amount === 0) {

        list.innerHTML = `
            <div class="empty">
                لا يوجد لاعبين حالياً
            </div>
        `;
    }
}

function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent =
        String(value);

    return div.innerHTML;
}

window.addEventListener(
    "beforeunload",
    () => {

        if (stream) {

            for (
                const track of
                stream.getTracks()
            ) {
                track.stop();
            }
        }

        for (const pc of peers.values()) {

            try {
                pc.close();
            } catch {}
        }
    }
);

</script>

</body>

</html>
