<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>MicBlox</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    background:
        radial-gradient(
            circle at 20% 10%,
            #25365c 0,
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 90%,
            #173c30 0,
            transparent 35%
        ),
        #070a10;

    color: white;

    font-family:
        Arial,
        sans-serif;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;
}

.container {

    width: 460px;

    max-width: 100%;

    padding: 26px;

    border-radius: 28px;

    background:
        rgba(13,17,25,.88);

    border:
        1px solid
        rgba(255,255,255,.09);

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.55);

    backdrop-filter:
        blur(20px);
}

.logo {

    text-align: center;

    font-size: 32px;

    font-weight: 900;

    margin-bottom: 5px;
}

.subtitle {

    text-align: center;

    color: #8992a5;

    margin-bottom: 22px;
}

.card {

    background:
        rgba(255,255,255,.045);

    border:
        1px solid
        rgba(255,255,255,.06);

    border-radius: 22px;

    padding: 22px;

    text-align: center;
}

.mic {

    width: 100px;

    height: 100px;

    margin: auto;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 42px;

    background:
        #202735;

    transition: .25s;
}

.mic.active {

    background:
        #123c2a;

    box-shadow:
        0 0 45px
        rgba(53,226,124,.35);
}

.status {

    margin-top: 15px;

    font-size: 18px;

    color: #ff6262;
}

.status.active {

    color: #35e27c;
}

button {

    width: 100%;

    border: 0;

    border-radius: 14px;

    padding: 14px;

    margin-top: 15px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    background:
        #35e27c;

    color:
        #06130b;
}

button.off {

    background:
        #ff4d4d;

    color: white;
}

.copy {

    background:
        #293246;

    color: white;
}

.link {

    margin-top: 15px;

    background:
        rgba(0,0,0,.3);

    border-radius: 12px;

    padding: 10px;

    font-size: 12px;

    color: #9fa8ba;

    word-break: break-all;
}

.section {

    margin-top: 20px;
}

.sectionTitle {

    display: flex;

    justify-content:
        space-between;

    margin-bottom: 10px;
}

.count {

    color: #35e27c;
}

.players {

    display: flex;

    flex-direction: column;

    gap: 8px;
}

.player {

    display: flex;

    align-items: center;

    justify-content:
        space-between;

    padding: 12px;

    border-radius: 15px;

    background:
        rgba(255,255,255,.045);
}

.left {

    display: flex;

    align-items: center;

    gap: 10px;
}

.avatar {

    width: 42px;

    height: 42px;

    border-radius: 50%;

    background:
        #293246;

    display: flex;

    align-items: center;

    justify-content: center;
}

.name {

    font-weight: bold;
}

.distance {

    color: #8992a5;

    font-size: 12px;

    margin-top: 3px;
}

.voice {

    font-size: 20px;
}

.connection {

    text-align: center;

    margin-top: 18px;

    font-size: 13px;

    color: #8992a5;
}

.online {

    color: #35e27c;
}

.offline {

    color: #ff4d4d;
}

.error {

    color: #ff6262;

    margin-top: 12px;

    font-size: 13px;
}

</style>

</head>

<body>

<div class="container">

    <div class="logo">
        🎙️ MicBlox
    </div>

    <div class="subtitle">
        نظام الصوت القريب
    </div>

    <div class="card">

        <div
            id="mic"
            class="mic"
        >
            🎙️
        </div>

        <div
            id="status"
            class="status"
        >
            المايك مقفل
        </div>

        <button id="micButton">
            تشغيل المايك
        </button>

        <button
            id="copyButton"
            class="copy"
        >
            📋 نسخ الرابط
        </button>

        <div
            id="link"
            class="link"
        >
            جاري تحميل الرابط...
        </div>

        <div
            id="error"
            class="error"
        ></div>

    </div>

    <div class="section">

        <div class="sectionTitle">

            <b>
                اللاعبين القريبين
            </b>

            <span
                id="count"
                class="count"
            >
                0
            </span>

        </div>

        <div
            id="players"
            class="players"
        >

            <div class="player">
                جاري تحميل اللاعبين...
            </div>

        </div>

    </div>

    <div class="connection">

        الحالة:

        <span
            id="connection"
            class="offline"
        >
            جاري الاتصال...
        </span>

    </div>

</div>

<script>

/*
============================================================
TOKEN
============================================================
*/

const token =
    location.pathname
        .split("/")
        .filter(Boolean)[0];

if (!token) {

    document.body.innerHTML =
        "<h2>الرابط غير صالح</h2>";

    throw new Error(
        "No token"
    );
}

/*
============================================================
ELEMENTS
============================================================
*/

const micButton =
    document.getElementById(
        "micButton"
    );

const mic =
    document.getElementById(
        "mic"
    );

const status =
    document.getElementById(
        "status"
    );

const copyButton =
    document.getElementById(
        "copyButton"
    );

const linkElement =
    document.getElementById(
        "link"
    );

const errorElement =
    document.getElementById(
        "error"
    );

const playersElement =
    document.getElementById(
        "players"
    );

const countElement =
    document.getElementById(
        "count"
    );

const connectionElement =
    document.getElementById(
        "connection"
    );

/*
============================================================
STATE
============================================================
*/

let socket = null;

let microphoneStream = null;

let micEnabled = false;

let localPlayer = null;

let players = new Map();

let peers = new Map();

let audioElements = new Map();

let maxDistance = 30;

let fullDistance = 7;

let reconnectTimer = null;

/*
============================================================
LINK
============================================================
*/

linkElement.textContent =
    location.href;

copyButton.onclick =
    async () => {

        try {

            await navigator.clipboard
                .writeText(
                    location.href
                );

            copyButton.textContent =
                "✅ تم نسخ الرابط";

            setTimeout(() => {

                copyButton.textContent =
                    "📋 نسخ الرابط";

            }, 1800);

        } catch {

            errorElement.textContent =
                "لم يتمكن المتصفح من نسخ الرابط.";

        }
    };

/*
============================================================
WEBSOCKET
============================================================
*/

function connect() {

    if (
        socket &&
        (
            socket.readyState ===
            WebSocket.OPEN ||
            socket.readyState ===
            WebSocket.CONNECTING
        )
    ) {
        return;
    }

    const protocol =
        location.protocol === "https:"
            ? "wss:"
            : "ws:";

    socket =
        new WebSocket(
            protocol +
            "//" +
            location.host +
            "/ws?token=" +
            encodeURIComponent(token)
        );

    socket.onopen = () => {

        connectionElement.textContent =
            "متصل";

        connectionElement.className =
            "online";

        sendUsername();
    };

    socket.onclose = () => {

        connectionElement.textContent =
            "إعادة الاتصال...";

        connectionElement.className =
            "offline";

        clearTimeout(
            reconnectTimer
        );

        reconnectTimer =
            setTimeout(
                connect,
                2000
            );
    };

    socket.onerror = () => {

        connectionElement.textContent =
            "خطأ";

        connectionElement.className =
            "offline";
    };

    socket.onmessage =
        async event => {

        let data;

        try {

            data =
                JSON.parse(
                    event.data
                );

        } catch {

            return;
        }

        /*
        CONNECTED
        */

        if (
            data.type ===
            "connected"
        ) {

            localPlayer =
                data.player;

            players.set(
                localPlayer.token,
                localPlayer
            );

            renderPlayers();

            return;
        }

        /*
        PEERS
        */

        if (
            data.type ===
            "peers"
        ) {

            for (
                const player of
                data.players || []
            ) {

                players.set(
                    player.token,
                    player
                );

                await createPeer(
                    player.token,
                    true
                );
            }

            renderPlayers();

            return;
        }

        /*
        JOIN
        */

        if (
            data.type ===
            "player_joined"
        ) {

            if (!data.player)
                return;

            players.set(
                data.player.token,
                data.player
            );

            /*
            اللاعب الجديد هو الذي
            يبدأ الاتصال
            */

            await createPeer(
                data.player.token,
                true
            );

            renderPlayers();

            return;
        }

        /*
        UPDATE
        */

        if (
            data.type ===
            "player_update"
        ) {

            if (!data.player)
                return;

            players.set(
                data.player.token,
                data.player
            );

            renderPlayers();

            updateAllVolumes();

            return;
        }

        /*
        LEFT
        */

        if (
            data.type ===
            "player_left"
        ) {

            removePeer(
                data.token
            );

            players.delete(
                data.token
            );

            renderPlayers();

            return;
        }

        /*
        POSITIONS
        */

        if (
            data.type ===
            "positions"
        ) {

            maxDistance =
                30;

            fullDistance =
                7;

            for (
                const player of
                data.players || []
            ) {

                players.set(
                    player.token,
                    player
                );

                if (
                    player.token ===
                    token
                ) {

                    localPlayer =
                        player;
                }
            }

            renderPlayers();

            updateAllVolumes();

            return;
        }

        /*
        SIGNAL
        */

        if (
            data.type ===
            "signal"
        ) {

            await handleSignal(
                data.from,
                data.signal
            );

            return;
        }
    };
}

connect();

/*
============================================================
USERNAME
============================================================
*/

function sendUsername() {

    if (
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ) {
        return;
    }

    socket.send(
        JSON.stringify({
            type: "username",
            username:
                "Roblox Player"
        })
    );
}

/*
============================================================
MIC BUTTON
============================================================
*/

micButton.onclick =
    async () => {

        errorElement.textContent =
            "";

        if (micEnabled) {

            disableMic();

        } else {

            await enableMic();
        }
    };

/*
============================================================
ENABLE MIC
============================================================
*/

async function enableMic() {

    try {

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices
                .getUserMedia
        ) {

            throw new Error(
                "Microphone unavailable"
            );
        }

        microphoneStream =
            await navigator.mediaDevices
                .getUserMedia({

                    audio: {

                        echoCancellation:
                            true,

                        noiseSuppression:
                            true,

                        autoGainControl:
                            true,

                        channelCount:
                            1
                    }
                });

        micEnabled = true;

        mic.classList.add(
            "active"
        );

        mic.textContent =
            "🔊";

        status.textContent =
            "المايك شغال";

        status.classList.add(
            "active"
        );

        micButton.textContent =
            "إيقاف المايك";

        micButton.classList.add(
            "off"
        );

        sendMic();

        /*
        إضافة المايك لكل الاتصالات
        */

        for (
            const [
                remoteToken,
                pc
            ] of peers
        ) {

            await attachMicrophone(
                remoteToken,
                pc
            );
        }

    } catch (error) {

        console.error(
            "MIC ERROR:",
            error
        );

        errorElement.textContent =
            "اسمح للمتصفح باستخدام الميكروفون ثم اضغط مرة ثانية.";
    }
}

/*
============================================================
DISABLE MIC
============================================================
*/

function disableMic() {

    micEnabled =
        false;

    if (microphoneStream) {

        microphoneStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        microphoneStream =
            null;
    }

    mic.classList.remove(
        "active"
    );

    mic.textContent =
        "🎙️";

    status.textContent =
        "المايك مقفل";

    status.classList.remove(
        "active"
    );

    micButton.textContent =
        "تشغيل المايك";

    micButton.classList.remove(
        "off"
    );

    sendMic();
}

/*
============================================================
SEND MIC STATE
============================================================
*/

function sendMic() {

    if (
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ) {
        return;
    }

    socket.send(
        JSON.stringify({
            type: "mic",
            enabled:
                micEnabled
        })
    );
}

/*
============================================================
CREATE PEER
============================================================
*/

async function createPeer(
    remoteToken,
    createOffer
) {

    if (
        !remoteToken ||
        remoteToken === token
    ) {
        return null;
    }

    if (
        peers.has(remoteToken)
    ) {

        return peers.get(
            remoteToken
        );
    }

    const pc =
        new RTCPeerConnection({

            iceServers: [

                {
                    urls:
                        "stun:stun.l.google.com:19302"
                },

                {
                    urls:
                        "stun:stun1.l.google.com:19302"
                }
            ]
        });

    peers.set(
        remoteToken,
        pc
    );

    /*
    MIC TRACK
    */

    if (microphoneStream) {

        for (
            const track of
            microphoneStream.getTracks()
        ) {

            pc.addTrack(
                track,
                microphoneStream
            );
        }
    }

    /*
    AUDIO
    */

    pc.ontrack =
        event => {

        let audio =
            audioElements.get(
                remoteToken
            );

        if (!audio) {

            audio =
                document.createElement(
                    "audio"
                );

            audio.autoplay =
                true;

            audio.playsInline =
                true;

            audio.controls =
                false;

            audio.style.display =
                "none";

            document.body.appendChild(
                audio
            );

            audioElements.set(
                remoteToken,
                audio
            );
        }

        if (
            event.streams &&
            event.streams[0]
        ) {

            audio.srcObject =
                event.streams[0];

            audio.play()
                .catch(
                    () => {}
                );
        }

        updateAudioVolume(
            remoteToken
        );
    };

    /*
    ICE
    */

    pc.onicecandidate =
        event => {

        if (
            !event.candidate
        ) {
            return;
        }

        sendSignal(
            remoteToken,
            {
                type:
                    "candidate",

                candidate:
                    event.candidate
            }
        );
    };

    /*
    CONNECTION
    */

    pc.onconnectionstatechange =
        () => {

        const state =
            pc.connectionState;

        console.log(
            "WebRTC:",
            remoteToken,
            state
        );

        if (
            state === "failed"
        ) {

            restartPeer(
                remoteToken
            );
        }

        if (
            state === "closed"
        ) {

            removePeer(
                remoteToken
            );
        }
    };

    /*
    OFFER
    */

    if (createOffer) {

        const offer =
            await pc.createOffer();

        await pc.setLocalDescription(
            offer
        );

        sendSignal(
            remoteToken,
            {
                type:
                    "offer",

                offer:
                    pc.localDescription
            }
        );
    }

    return pc;
}

/*
============================================================
ATTACH MICROPHONE
============================================================
*/

async function attachMicrophone(
    remoteToken,
    pc
) {

    if (!microphoneStream)
        return;

    const tracks =
        microphoneStream
            .getAudioTracks();

    if (!tracks.length)
        return;

    const track =
        tracks[0];

    const sender =
        pc.getSenders()
            .find(
                s =>
                    s.track &&
                    s.track.kind ===
                    "audio"
            );

    /*
    إذا موجود نبدل التراك
    */

    if (sender) {

        try {

            await sender.replaceTrack(
                track
            );

            return;

        } catch {}
    }

    pc.addTrack(
        track,
        microphoneStream
    );

    /*
    إعادة تفاوض
    */

    try {

        const offer =
            await pc.createOffer();

        await pc.setLocalDescription(
            offer
        );

        sendSignal(
            remoteToken,
            {
                type:
                    "offer",

                offer:
                    pc.localDescription
            }
        );

    } catch (error) {

        console.error(
            "Renegotiation error:",
            error
        );
    }
}

/*
============================================================
SIGNAL
============================================================
*/

function sendSignal(
    remoteToken,
    signal
) {

    if (
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ) {
        return;
    }

    socket.send(
        JSON.stringify({

            type:
                "signal",

            to:
                remoteToken,

            signal
        })
    );
}

/*
============================================================
HANDLE SIGNAL
============================================================
*/

async function handleSignal(
    remoteToken,
    signal
) {

    const pc =
        await createPeer(
            remoteToken,
            false
        );

    if (!pc || !signal)
        return;

    /*
    OFFER
    */

    if (
        signal.type ===
        "offer"
    ) {

        await pc.setRemoteDescription(
            signal.offer
        );

        if (microphoneStream) {

            await attachMicrophone(
                remoteToken,
                pc
            );
        }

        const answer =
            await pc.createAnswer();

        await pc.setLocalDescription(
            answer
        );

        sendSignal(
            remoteToken,
            {
                type:
                    "answer",

                answer:
                    pc.localDescription
            }
        );

        return;
    }

    /*
    ANSWER
    */

    if (
        signal.type ===
        "answer"
    ) {

        await pc.setRemoteDescription(
            signal.answer
        );

        return;
    }

    /*
    ICE
    */

    if (
        signal.type ===
        "candidate"
    ) {

        try {

            await pc.addIceCandidate(
                signal.candidate
            );

        } catch (error) {

            console.warn(
                "ICE error:",
                error
            );
        }
    }
}

/*
============================================================
RESTART PEER
============================================================
*/

async function restartPeer(
    remoteToken
) {

    removePeer(
        remoteToken
    );

    await createPeer(
        remoteToken,
        true
    );
}

/*
============================================================
REMOVE PEER
============================================================
*/

function removePeer(
    remoteToken
) {

    const pc =
        peers.get(
            remoteToken
        );

    if (pc) {

        try {
            pc.close();
        } catch {}

        peers.delete(
            remoteToken
        );
    }

    const audio =
        audioElements.get(
            remoteToken
        );

    if (audio) {

        try {
            audio.pause();
        } catch {}

        audio.srcObject =
            null;

        audio.remove();

        audioElements.delete(
            remoteToken
        );
    }
}

/*
============================================================
DISTANCE
============================================================
*/

function distance(a, b) {

    if (!a || !b)
        return Infinity;

    const dx =
        Number(a.x || 0) -
        Number(b.x || 0);

    const dy =
        Number(a.y || 0) -
        Number(b.y || 0);

    const dz =
        Number(a.z || 0) -
        Number(b.z || 0);

    return Math.sqrt(
        dx * dx +
        dy * dy +
        dz * dz
    );
}

/*
============================================================
VOLUME
============================================================
*/

function updateAudioVolume(
    remoteToken
) {

    const audio =
        audioElements.get(
            remoteToken
        );

    if (!audio)
        return;

    if (!localPlayer)
        return;

    const player =
        players.get(
            remoteToken
        );

    if (!player)
        return;

    /*
    ميوت
    */

    if (
        !player.micEnabled ||
        player.muted
    ) {

        audio.volume =
            0;

        return;
    }

    const d =
        distance(
            localPlayer,
            player
        );

    /*
    أكثر من 30
    */

    if (
        d >= 30
    ) {

        audio.volume =
            0;

        return;
    }

    /*
    أقل من 7
    */

    if (
        d <= 7
    ) {

        audio.volume =
            1;

        return;
    }

    /*
    7 -> 30
    */

    const volume =
        1 -
        (
            (d - 7) /
            (30 - 7)
        );

    audio.volume =
        Math.max(
            0,
            Math.min(
                1,
                volume
            )
        );
}

/*
============================================================
ALL VOLUMES
============================================================
*/

function updateAllVolumes() {

    for (
        const remoteToken of
        audioElements.keys()
    ) {

        updateAudioVolume(
            remoteToken
        );
    }
}

/*
============================================================
UI
============================================================
*/

function renderPlayers() {

    if (!localPlayer)
        return;

    const nearby = [];

    for (
        const player of
        players.values()
    ) {

        if (
            player.token ===
            token
        ) {
            continue;
        }

        const d =
            distance(
                localPlayer,
                player
            );

        if (
            d <= 30
        ) {

            nearby.push({
                player,
                distance: d
            });
        }
    }

    nearby.sort(
        (a, b) =>
            a.distance -
            b.distance
    );

    countElement.textContent =
        nearby.length;

    playersElement.innerHTML =
        "";

    if (!nearby.length) {

        playersElement.innerHTML =
            `
            <div class="player">
                لا يوجد لاعبين ضمن 30 متر
            </div>
            `;

        return;
    }

    for (
        const item of nearby
    ) {

        const player =
            item.player;

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "player";

        div.innerHTML =
            `
            <div class="left">

                <div class="avatar">
                    👤
                </div>

                <div>

                    <div class="name">
                        ${escapeHTML(
                            player.username ||
                            "Player"
                        )}
                    </div>

                    <div class="distance">
                        ${item.distance.toFixed(1)}
                        متر
                    </div>

                </div>

            </div>

            <div class="voice">
                ${
                    player.micEnabled &&
                    !player.muted
                        ? "🔊"
                        : "🔇"
                }
            </div>
            `;

        playersElement.appendChild(
            div
        );
    }
}

/*
============================================================
ESCAPE
============================================================
*/

function escapeHTML(value) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        String(value);

    return div.innerHTML;
}

/*
============================================================
CONTINUOUS AUDIO CHECK
============================================================
*/

setInterval(
    () => {

        updateAllVolumes();

        renderPlayers();

    },
    250
);

/*
============================================================
CLEANUP
============================================================
*/

window.addEventListener(
    "beforeunload",
    () => {

        if (microphoneStream) {

            microphoneStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );
        }

        for (
            const pc of
            peers.values()
        ) {

            try {
                pc.close();
            } catch {}
        }
    }
);

</script>
