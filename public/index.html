<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MicBlox Voice</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {

    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% -20%,
            #283b67 0%,
            #111827 35%,
            #070a11 75%
        );

    color: #fff;

    font-family:
        Arial,
        "Segoe UI",
        sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;

    overflow-x: hidden;
}

body::before {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    background:
        linear-gradient(
            120deg,
            transparent,
            rgba(255,255,255,.025),
            transparent
        );
}

.container {

    width: 470px;

    max-width: calc(100% - 28px);

    padding: 24px;

    border-radius: 28px;

    background:
        rgba(12,16,25,.88);

    border:
        1px solid
        rgba(255,255,255,.09);

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.55);

    backdrop-filter:
        blur(25px);
}

.header {

    text-align: center;

    margin-bottom: 22px;
}

.logo {

    font-size: 34px;

    font-weight: 900;

    letter-spacing: -.8px;
}

.logo span {

    color: #54e38e;
}

.subtitle {

    margin-top: 7px;

    color: #8e98aa;

    font-size: 14px;
}

.micCard {

    padding: 25px;

    border-radius: 22px;

    background:
        linear-gradient(
            145deg,
            rgba(32,39,55,.9),
            rgba(18,23,33,.9)
        );

    border:
        1px solid
        rgba(255,255,255,.07);

    text-align: center;
}

.mic {

    width: 100px;

    height: 100px;

    margin: auto;

    border-radius: 50%;

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 42px;

    background:
        #202838;

    box-shadow:
        inset 0 0 0 1px
        rgba(255,255,255,.06),

        0 15px 40px
        rgba(0,0,0,.3);

    transition:
        .25s ease;
}

.mic.active {

    background:
        #173d2a;

    box-shadow:
        0 0 0 8px
        rgba(84,227,142,.06),

        0 0 50px
        rgba(84,227,142,.25);
}

.status {

    margin-top: 16px;

    font-size: 16px;

    color: #ff6b6b;
}

.status.active {

    color: #54e38e;
}

#micButton {

    width: 100%;

    margin-top: 17px;

    border: 0;

    border-radius: 14px;

    padding: 15px;

    font-size: 16px;

    font-weight: 800;

    cursor: pointer;

    color: #06130b;

    background:
        #54e38e;

    transition:
        .2s ease;
}

#micButton:hover {

    transform:
        translateY(-1px);

    filter:
        brightness(1.08);
}

#micButton.off {

    background:
        #ff5757;

    color: white;
}

.linkBox {

    margin-top: 17px;

    padding: 14px;

    border-radius: 15px;

    background:
        rgba(0,0,0,.2);

    border:
        1px solid
        rgba(255,255,255,.06);
}

.linkTitle {

    color: #8e98aa;

    font-size: 12px;

    margin-bottom: 8px;
}

.linkRow {

    display: flex;

    gap: 8px;
}

#voiceLink {

    min-width: 0;

    flex: 1;

    padding: 11px;

    border-radius: 10px;

    border: 1px solid
        rgba(255,255,255,.08);

    background:
        #0d121b;

    color: #dce4f2;

    outline: none;

    direction: ltr;

    font-size: 12px;
}

#copyButton {

    border: 0;

    border-radius: 10px;

    padding: 0 15px;

    background:
        #283246;

    color: white;

    cursor: pointer;

    font-weight: bold;
}

#copyButton:hover {

    background:
        #34415b;
}

.section {

    margin-top: 22px;
}

.sectionHeader {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 10px;
}

.sectionHeader span {

    color: #697589;

    font-size: 12px;
}

.players {

    display: flex;

    flex-direction: column;

    gap: 9px;
}

.player {

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 12px;

    border-radius: 15px;

    background:
        #151b27;

    border:
        1px solid
        rgba(255,255,255,.045);
}

.playerLeft {

    display: flex;

    align-items: center;

    gap: 11px;
}

.avatar {

    width: 42px;

    height: 42px;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        #273146;

    font-size: 20px;
}

.name {

    font-weight: 800;

    font-size: 14px;
}

.voiceState {

    color: #54e38e;

    font-size: 18px;
}

.voiceState.off {

    color: #677286;
}

.empty {

    padding: 25px;

    text-align: center;

    border-radius: 15px;

    background:
        #151b27;

    color: #6f7b90;

    font-size: 13px;
}

.connection {

    margin-top: 18px;

    text-align: center;

    color: #68748a;

    font-size: 12px;
}

.online {

    color: #54e38e;
}

.offline {

    color: #ff5757;
}

.error {

    color: #ff6666;

    font-size: 12px;

    margin-top: 10px;
}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">
            🎙️ Mic<span>Blox</span>
        </div>

        <div class="subtitle">
            نظام الصوت داخل السيرفر
        </div>

    </div>

    <div class="micCard">

        <div
            id="micCircle"
            class="mic"
        >
            🎙️
        </div>

        <div
            id="micStatus"
            class="status"
        >
            المايك مقفل
        </div>

        <button id="micButton">
            تشغيل المايك
        </button>

        <div class="linkBox">

            <div class="linkTitle">
                رابط المايك الخاص بك
            </div>

            <div class="linkRow">

                <input
                    id="voiceLink"
                    readonly
                    value=""
                >

                <button
                    id="copyButton"
                >
                    نسخ
                </button>

            </div>

        </div>

        <div
            id="error"
            class="error"
        ></div>

    </div>

    <div class="section">

        <div class="sectionHeader">

            <b>
                اللاعبين
            </b>

            <span id="count">
                0 لاعبين
            </span>

        </div>

        <div
            id="players"
            class="players"
        >

            <div class="empty">
                جاري تحميل اللاعبين...
            </div>

        </div>

    </div>

    <div class="connection">

        الحالة:

        <span
            id="connection"
            class="offline"
        >
            جاري الاتصال...
        </span>

    </div>

</div>

<script>

/*
============================================================
TOKEN
============================================================
*/

const parts =
    location.pathname
        .split("/")
        .filter(Boolean);

const token =
    parts.length
        ? parts[0]
        : null;

if (!token) {

    document.body.innerHTML = `
        <div style="
            color:white;
            font-family:Arial;
            text-align:center;
            padding:30px;
        ">
            الرابط غير صالح
        </div>
    `;

    throw new Error(
        "Missing token"
    );
}

/*
============================================================
ELEMENTS
============================================================
*/

const micButton =
    document.getElementById(
        "micButton"
    );

const micCircle =
    document.getElementById(
        "micCircle"
    );

const micStatus =
    document.getElementById(
        "micStatus"
    );

const playersElement =
    document.getElementById(
        "players"
    );

const countElement =
    document.getElementById(
        "count"
    );

const connectionElement =
    document.getElementById(
        "connection"
    );

const errorElement =
    document.getElementById(
        "error"
    );

const voiceLink =
    document.getElementById(
        "voiceLink"
    );

const copyButton =
    document.getElementById(
        "copyButton"
    );

/*
============================================================
STATE
============================================================
*/

let socket = null;

let localPlayer = null;

let players = new Map();

let microphoneStream = null;

let micEnabled = false;

let peerConnections = new Map();

let audioElements = new Map();

/*
============================================================
LINK
============================================================
*/

voiceLink.value =
    location.href;

copyButton.onclick =
    async () => {

        try {

            await navigator.clipboard.writeText(
                location.href
            );

            copyButton.textContent =
                "تم النسخ ✓";

            setTimeout(
                () => {

                    copyButton.textContent =
                        "نسخ";

                },
                1500
            );

        } catch {

            voiceLink.focus();

            voiceLink.select();

            document.execCommand(
                "copy"
            );

            copyButton.textContent =
                "تم النسخ ✓";

            setTimeout(
                () => {

                    copyButton.textContent =
                        "نسخ";

                },
                1500
            );
        }
    };

/*
============================================================
WEBSOCKET
============================================================
*/

function connect() {

    const protocol =
        location.protocol === "https:"
            ? "wss:"
            : "ws:";

    socket =
        new WebSocket(
            `${protocol}//${location.host}/ws?token=${encodeURIComponent(token)}`
        );

    socket.onopen =
        () => {

            connectionElement.textContent =
                "متصل";

            connectionElement.className =
                "online";

            sendUsername();
        };

    socket.onclose =
        () => {

            connectionElement.textContent =
                "انقطع الاتصال";

            connectionElement.className =
                "offline";

            setTimeout(
                connect,
                2000
            );
        };

    socket.onerror =
        () => {

            connectionElement.textContent =
                "خطأ";

            connectionElement.className =
                "offline";
        };

    socket.onmessage =
        async event => {

            let data;

            try {

                data =
                    JSON.parse(
                        event.data
                    );

            } catch {

                return;
            }

            if (
                data.type ===
                "connected"
            ) {

                localPlayer =
                    data.player;

                players.set(
                    localPlayer.token,
                    localPlayer
                );

                renderPlayers();

                return;
            }

            if (
                data.type ===
                "peers"
            ) {

                for (
                    const player of
                    data.players || []
                ) {

                    players.set(
                        player.token,
                        player
                    );

                    await createPeer(
                        player.token,
                        true
                    );
                }

                renderPlayers();

                return;
            }

            if (
                data.type ===
                "player_joined"
            ) {

                if (!data.player) {
                    return;
                }

                players.set(
                    data.player.token,
                    data.player
                );

                renderPlayers();

                return;
            }

            if (
                data.type ===
                "player_update"
            ) {

                if (!data.player) {
                    return;
                }

                players.set(
                    data.player.token,
                    data.player
                );

                renderPlayers();

                return;
            }

            if (
                data.type ===
                "player_left"
            ) {

                removePeer(
                    data.token
                );

                players.delete(
                    data.token
                );

                renderPlayers();

                return;
            }

            if (
                data.type ===
                "positions"
            ) {

                for (
                    const player of
                    data.players || []
                ) {

                    players.set(
                        player.token,
                        player
                    );
                }

                renderPlayers();

                return;
            }

            if (
                data.type ===
                "signal"
            ) {

                await handleSignal(
                    data.from,
                    data.signal
                );
            }
        };
}

connect();

/*
============================================================
USERNAME
============================================================
*/

function sendUsername() {

    if (
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ) {
        return;
    }

    socket.send(
        JSON.stringify({

            type:
                "username",

            username:
                "Roblox Player"
        })
    );
}

/*
============================================================
MIC BUTTON
============================================================
*/

micButton.onclick =
    async () => {

        errorElement.textContent =
            "";

        if (
            micEnabled
        ) {

            disableMic();

        } else {

            await enableMic();
        }
    };

/*
============================================================
ENABLE MIC
============================================================
*/

async function enableMic() {

    try {

        microphoneStream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    audio: {

                        echoCancellation:
                            true,

                        noiseSuppression:
                            true,

                        autoGainControl:
                            true,

                        channelCount:
                            1
                    }
                });

        micEnabled =
            true;

        micStatus.textContent =
            "المايك شغال";

        micStatus.classList.add(
            "active"
        );

        micCircle.classList.add(
            "active"
        );

        micCircle.textContent =
            "🔊";

        micButton.textContent =
            "إيقاف المايك";

        micButton.classList.add(
            "off"
        );

        sendMicState();

        for (
            const pc of
            peerConnections.values()
        ) {

            addMicrophoneToPeer(
                pc
            );
        }

    } catch (error) {

        console.error(
            error
        );

        errorElement.textContent =
            "اسمح للموقع باستخدام الميكروفون أولًا.";
    }
}

/*
============================================================
DISABLE MIC
============================================================
*/

function disableMic() {

    micEnabled =
        false;

    if (
        microphoneStream
    ) {

        for (
            const track of
            microphoneStream.getTracks()
        ) {

            track.stop();
        }

        microphoneStream =
            null;
    }

    micStatus.textContent =
        "المايك مقفل";

    micStatus.classList.remove(
        "active"
    );

    micCircle.classList.remove(
        "active"
    );

    micCircle.textContent =
        "🎙️";

    micButton.textContent =
        "تشغيل المايك";

    micButton.classList.remove(
        "off"
    );

    sendMicState();
}

/*
============================================================
MIC STATE
============================================================
*/

function sendMicState() {

    if (
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ) {
        return;
    }

    socket.send(
        JSON.stringify({

            type:
                "mic",

            enabled:
                micEnabled
        })
    );
}

/*
============================================================
PEER
============================================================
*/

async function createPeer(
    remoteToken,
    createOffer
) {

    if (
        !remoteToken ||
        remoteToken === token
    ) {
        return null;
    }

    if (
        peerConnections.has(
            remoteToken
        )
    ) {

        return peerConnections.get(
            remoteToken
        );
    }

    const pc =
        new RTCPeerConnection({

            iceServers: [

                {
                    urls:
                        "stun:stun.l.google.com:19302"
                },

                {
                    urls:
                        "stun:stun1.l.google.com:19302"
                }
            ]
        });

    peerConnections.set(
        remoteToken,
        pc
    );

    if (
        microphoneStream
    ) {

        for (
            const track of
            microphoneStream.getTracks()
        ) {

            pc.addTrack(
                track,
                microphoneStream
            );
        }
    }

    pc.ontrack =
        event => {

            let audio =
                audioElements.get(
                    remoteToken
                );

            if (!audio) {

                audio =
                    document.createElement(
                        "audio"
                    );

                audio.autoplay =
                    true;

                audio.playsInline =
                    true;

                audio.setAttribute(
                    "playsinline",
                    ""
                );

                document.body.appendChild(
                    audio
                );

                audioElements.set(
                    remoteToken,
                    audio
                );
            }

            if (
                event.streams &&
                event.streams[0]
            ) {

                audio.srcObject =
                    event.streams[0];
            }

            audio.volume =
                1;

            audio.play()
                .catch(
                    () => {}
                );
        };

    pc.onicecandidate =
        event => {

            if (
                !event.candidate
            ) {
                return;
            }

            sendSignal(
                remoteToken,
                {

                    type:
                        "candidate",

                    candidate:
                        event.candidate
                }
            );
        };

    pc.onconnectionstatechange =
        () => {

            if (
                pc.connectionState ===
                    "failed" ||
                pc.connectionState ===
                    "closed"
            ) {

                removePeer(
                    remoteToken
                );
            }
        };

    if (
        createOffer
    ) {

        const offer =
            await pc.createOffer();

        await pc.setLocalDescription(
            offer
        );

        sendSignal(
            remoteToken,
            {

                type:
                    "offer",

                offer
            }
        );
    }

    return pc;
}

/*
============================================================
MIC TO PEER
============================================================
*/

async function addMicrophoneToPeer(
    pc
) {

    if (
        !microphoneStream
    ) {
        return;
    }

    const senders =
        pc.getSenders();

    for (
        const track of
        microphoneStream.getTracks()
    ) {

        const existing =
            senders.find(
                sender =>
                    sender.track &&
                    sender.track.kind ===
                    track.kind
            );

        if (
            existing
        ) {

            try {

                await existing.replaceTrack(
                    track
                );

            } catch {}

        } else {

            pc.addTrack(
                track,
                microphoneStream
            );
        }
    }
}

/*
============================================================
SIGNAL
============================================================
*/

function sendSignal(
    remoteToken,
    signal
) {

    if (
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ) {
        return;
    }

    socket.send(
        JSON.stringify({

            type:
                "signal",

            to:
                remoteToken,

            signal
        })
    );
}

/*
============================================================
HANDLE SIGNAL
============================================================
*/

async function handleSignal(
    remoteToken,
    signal
) {

    const pc =
        await createPeer(
            remoteToken,
            false
        );

    if (
        !pc ||
        !signal
    ) {
        return;
    }

    if (
        signal.type ===
        "offer"
    ) {

        await pc.setRemoteDescription(
            signal.offer
        );

        if (
            microphoneStream
        ) {

            await addMicrophoneToPeer(
                pc
            );
        }

        const answer =
            await pc.createAnswer();

        await pc.setLocalDescription(
            answer
        );

        sendSignal(
            remoteToken,
            {

                type:
                    "answer",

                answer
            }
        );

        return;
    }

    if (
        signal.type ===
        "answer"
    ) {

        await pc.setRemoteDescription(
            signal.answer
        );

        return;
    }

    if (
        signal.type ===
        "candidate"
    ) {

        try {

            await pc.addIceCandidate(
                signal.candidate
            );

        } catch {}
    }
}

/*
============================================================
REMOVE PEER
============================================================
*/

function removePeer(
    remoteToken
) {

    const pc =
        peerConnections.get(
            remoteToken
        );

    if (pc) {

        try {
            pc.close();
        } catch {}

        peerConnections.delete(
            remoteToken
        );
    }

    const audio =
        audioElements.get(
            remoteToken
        );

    if (audio) {

        try {
            audio.pause();
        } catch {}

        audio.remove();

        audioElements.delete(
            remoteToken
        );
    }
}

/*
============================================================
PLAYERS UI
============================================================
*/

function renderPlayers() {

    if (!localPlayer) {
        return;
    }

    playersElement.innerHTML =
        "";

    const list = [];

    for (
        const player of
        players.values()
    ) {

        if (
            player.token ===
            localPlayer.token
        ) {
            continue;
        }

        list.push(
            player
        );
    }

    countElement.textContent =
        `${list.length} لاعبين`;

    if (
        list.length === 0
    ) {

        playersElement.innerHTML = `
            <div class="empty">
                لا يوجد لاعبين آخرين حاليًا
            </div>
        `;

        return;
    }

    for (
        const player of list
    ) {

        const element =
            document.createElement(
                "div"
            );

        element.className =
            "player";

        const active =
            player.micEnabled &&
            !player.muted;

        element.innerHTML = `

            <div class="playerLeft">

                <div class="avatar">
                    👤
                </div>

                <div>

                    <div class="name">
                        ${escapeHTML(
                            player.username ||
                            "Roblox Player"
                        )}
                    </div>

                </div>

            </div>

            <div
                class="voiceState ${
                    active
                        ? ""
                        : "off"
                }"
            >
                ${active ? "🔊" : "🔇"}
            </div>
        `;

        playersElement.appendChild(
            element
        );
    }
}

/*
============================================================
ESCAPE
============================================================
*/

function escapeHTML(
    value
) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        String(value);

    return div.innerHTML;
}

/*
============================================================
CLEANUP
============================================================
*/

window.addEventListener(
    "beforeunload",
    () => {

        if (
            microphoneStream
        ) {

            for (
                const track of
                microphoneStream.getTracks()
            ) {

                track.stop();
            }
        }

        for (
            const pc of
            peerConnections.values()
        ) {

            try {
                pc.close();
            } catch {}
        }
    }
);

</script>

</body>

</html>
