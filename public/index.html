<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MicBlox</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(59, 130, 246, .22),
            transparent 38%
        ),
        radial-gradient(
            circle at 100% 100%,
            rgba(34, 197, 94, .10),
            transparent 35%
        ),
        #070a10;

    color: #fff;

    font-family:
        Arial,
        "Segoe UI",
        sans-serif;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;
}

.container {
    width: 470px;
    max-width: 100%;

    background:
        linear-gradient(
            145deg,
            rgba(20, 25, 36, .97),
            rgba(10, 13, 20, .97)
        );

    border: 1px solid rgba(255,255,255,.08);

    border-radius: 28px;

    padding: 24px;

    box-shadow:
        0 30px 100px rgba(0,0,0,.65),
        inset 0 1px 0 rgba(255,255,255,.04);
}

/* HEADER */

.header {
    text-align: center;
    margin-bottom: 22px;
}

.logo {
    font-size: 31px;
    font-weight: 800;

    letter-spacing: -.8px;
}

.logo span {
    color: #4ade80;
}

.subtitle {
    color: #8b94a7;
    font-size: 13px;
    margin-top: 6px;
}

/* MIC */

.micBox {
    position: relative;

    background:
        linear-gradient(
            145deg,
            #151b27,
            #10141d
        );

    border: 1px solid rgba(255,255,255,.06);

    border-radius: 22px;

    padding: 25px;

    text-align: center;

    overflow: hidden;
}

.micBox::before {
    content: "";

    position: absolute;

    width: 180px;
    height: 180px;

    border-radius: 50%;

    background: rgba(74,222,128,.08);

    filter: blur(35px);

    top: -100px;
    left: 50%;

    transform: translateX(-50%);
}

.micCircle {
    position: relative;

    width: 95px;
    height: 95px;

    margin: auto;

    border-radius: 50%;

    background:
        linear-gradient(
            145deg,
            #252d3d,
            #171d29
        );

    border: 1px solid rgba(255,255,255,.08);

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 38px;

    box-shadow:
        0 15px 40px rgba(0,0,0,.35);

    transition:
        .25s ease;
}

.micCircle.active {
    background:
        linear-gradient(
            145deg,
            #1d7042,
            #123b27
        );

    box-shadow:
        0 0 0 8px rgba(74,222,128,.06),
        0 0 45px rgba(74,222,128,.25);
}

.status {
    margin-top: 16px;

    font-size: 17px;
    font-weight: 700;

    color: #ff6262;
}

.status.active {
    color: #4ade80;
}

#micButton {
    width: 100%;

    margin-top: 16px;

    padding: 14px;

    border: 0;
    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #4ade80,
            #22c55e
        );

    color: #04130a;

    font-size: 15px;
    font-weight: 800;

    cursor: pointer;

    transition: .2s;

    box-shadow:
        0 10px 25px rgba(34,197,94,.15);
}

#micButton:hover {
    transform: translateY(-1px);
}

#micButton.off {
    background:
        linear-gradient(
            135deg,
            #ff5b5b,
            #ef4444
        );

    color: white;
}

/* LINK */

.linkBox {
    margin-top: 15px;

    background: rgba(255,255,255,.035);

    border: 1px solid rgba(255,255,255,.06);

    border-radius: 13px;

    padding: 10px;
}

.linkTitle {
    color: #8992a5;
    font-size: 11px;
    margin-bottom: 7px;
}

.linkRow {
    display: flex;
    gap: 7px;
}

#linkInput {
    min-width: 0;
    flex: 1;

    border: 0;
    outline: 0;

    border-radius: 9px;

    background: #0b0f17;

    color: #cbd5e1;

    padding: 10px;

    font-size: 11px;

    direction: ltr;
}

#copyButton {
    border: 0;

    border-radius: 9px;

    padding: 0 13px;

    background: #252d3b;

    color: white;

    cursor: pointer;

    font-weight: 700;

    transition: .2s;
}

#copyButton:hover {
    background: #303b4f;
}

/* PLAYERS */

.section {
    margin-top: 22px;
}

.sectionTitle {
    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 10px;
}

.sectionTitle b {
    font-size: 15px;
}

#count {
    color: #8b94a7;
    font-size: 12px;
}

.players {
    display: flex;

    flex-direction: column;

    gap: 8px;
}

.player {
    background:
        linear-gradient(
            145deg,
            #171d28,
            #111620
        );

    border:
        1px solid
        rgba(255,255,255,.045);

    border-radius: 15px;

    padding: 11px;

    display: flex;

    align-items: center;

    justify-content: space-between;
}

.playerLeft {
    display: flex;

    align-items: center;

    gap: 10px;
}

.avatar {
    width: 42px;
    height: 42px;

    border-radius: 13px;

    background:
        linear-gradient(
            145deg,
            #293449,
            #1c2432
        );

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 20px;
}

.name {
    font-size: 14px;
    font-weight: 700;
}

.distance {
    color: #7f899c;

    font-size: 11px;

    margin-top: 4px;
}

.voiceBox {
    text-align: left;
    min-width: 65px;
}

.voiceIcon {
    font-size: 17px;
}

.volume {
    color: #4ade80;

    font-size: 11px;

    margin-top: 3px;
}

.empty {
    text-align: center;

    color: #737d90;

    padding: 25px;

    background: #111620;

    border-radius: 15px;

    border:
        1px solid
        rgba(255,255,255,.04);
}

/* CONNECTION */

.connection {
    margin-top: 17px;

    text-align: center;

    color: #70798b;

    font-size: 11px;
}

.online {
    color: #4ade80;
}

.offline {
    color: #ff5b5b;
}

.error {
    color: #ff6666;

    margin-top: 10px;

    font-size: 12px;
}

/* MOBILE */

@media(max-width: 500px) {

    body {
        padding: 10px;
    }

    .container {
        padding: 17px;
        border-radius: 22px;
    }

    .logo {
        font-size: 27px;
    }

    .micBox {
        padding: 20px;
    }

    .micCircle {
        width: 85px;
        height: 85px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">
            🎙️ Mic<span>Blox</span>
        </div>

        <div class="subtitle">
            نظام الصوت القريب — مدى الصوت 30 متر
        </div>

    </div>


    <!-- MIC -->

    <div class="micBox">

        <div
            class="micCircle"
            id="micCircle"
        >
            🎙️
        </div>

        <div
            class="status"
            id="micStatus"
        >
            المايك مقفل
        </div>

        <button id="micButton">
            تشغيل المايك
        </button>

        <div
            class="linkBox"
            id="linkBox"
        >

            <div class="linkTitle">
                رابط تفعيل المايك
            </div>

            <div class="linkRow">

                <input
                    id="linkInput"
                    readonly
                >

                <button id="copyButton">
                    نسخ
                </button>

            </div>

        </div>

        <div
            class="error"
            id="error"
        ></div>

    </div>


    <!-- PLAYERS -->

    <div class="section">

        <div class="sectionTitle">

            <b>
                اللاعبين القريبين
            </b>

            <span id="count">
                0 لاعبين
            </span>

        </div>

        <div
            class="players"
            id="players"
        >

            <div class="empty">
                جاري تحميل اللاعبين...
            </div>

        </div>

    </div>


    <!-- CONNECTION -->

    <div class="connection">

        الحالة:

        <span
            id="connection"
            class="offline"
        >
            جاري الاتصال...
        </span>

    </div>

</div>


<script>

/*
============================================================
TOKEN
============================================================
*/

const token =
    location.pathname
        .split("/")
        .filter(Boolean)[0];

if (!token) {

    document.body.innerHTML = `
        <div style="
            color:white;
            font-family:Arial;
            text-align:center;
            padding:30px;
        ">
            الرابط غير صالح
        </div>
    `;

    throw new Error("Missing token");
}


/*
============================================================
ELEMENTS
============================================================
*/

const micButton =
    document.getElementById("micButton");

const micStatus =
    document.getElementById("micStatus");

const micCircle =
    document.getElementById("micCircle");

const playersElement =
    document.getElementById("players");

const countElement =
    document.getElementById("count");

const connectionElement =
    document.getElementById("connection");

const errorElement =
    document.getElementById("error");

const linkInput =
    document.getElementById("linkInput");

const copyButton =
    document.getElementById("copyButton");


/*
============================================================
LINK
============================================================
*/

linkInput.value =
    window.location.href;

copyButton.onclick =
    async () => {

        try {

            await navigator.clipboard.writeText(
                window.location.href
            );

            copyButton.textContent =
                "تم النسخ ✓";

            setTimeout(() => {

                copyButton.textContent =
                    "نسخ";

            }, 1500);

        } catch {

            linkInput.select();

            document.execCommand("copy");

            copyButton.textContent =
                "تم النسخ ✓";

        }
    };


/*
============================================================
STATE
============================================================
*/

let socket = null;

let localPlayer = null;

let players = new Map();

let microphoneStream = null;

let micEnabled = false;

let peerConnections = new Map();

let audioElements = new Map();


/*
============================================================
IMPORTANT
============================================================

30 Roblox studs = 30 meters
for this system.

Maximum hearing distance:
30

Full volume distance:
7
============================================================
*/

const MAX_DISTANCE = 30;

const FULL_DISTANCE = 7;


/*
============================================================
WEBSOCKET
============================================================
*/

function connect() {

    const protocol =
        location.protocol === "https:"
            ? "wss:"
            : "ws:";

    socket =
        new WebSocket(
            `${protocol}//${location.host}/ws?token=${encodeURIComponent(token)}`
        );


    socket.onopen = () => {

        connectionElement.textContent =
            "متصل";

        connectionElement.className =
            "online";

        sendUsername();
    };


    socket.onclose = () => {

        connectionElement.textContent =
            "انقطع الاتصال";

        connectionElement.className =
            "offline";

        setTimeout(
            connect,
            2000
        );
    };


    socket.onerror = () => {

        connectionElement.textContent =
            "خطأ في الاتصال";

        connectionElement.className =
            "offline";
    };


    socket.onmessage =
        async event => {

            let data;

            try {

                data =
                    JSON.parse(
                        event.data
                    );

            } catch {

                return;
            }


            /*
            CONNECTED
            */

            if (
                data.type ===
                "connected"
            ) {

                localPlayer =
                    data.player;

                players.set(
                    localPlayer.token,
                    localPlayer
                );

                renderPlayers();

                return;
            }


            /*
            PEERS
            */

            if (
                data.type ===
                "peers"
            ) {

                for (
                    const player of
                    data.players || []
                ) {

                    players.set(
                        player.token,
                        player
                    );

                    await createPeer(
                        player.token,
                        true
                    );
                }

                renderPlayers();

                return;
            }


            /*
            PLAYER JOINED
            */

            if (
                data.type ===
                "player_joined"
            ) {

                const player =
                    data.player;

                if (!player) return;

                players.set(
                    player.token,
                    player
                );

                renderPlayers();

                return;
            }


            /*
            PLAYER UPDATE
            */

            if (
                data.type ===
                "player_update"
            ) {

                const player =
                    data.player;

                if (!player) return;

                players.set(
                    player.token,
                    player
                );

                renderPlayers();

                updateAudioVolumes();

                return;
            }


            /*
            PLAYER LEFT
            */

            if (
                data.type ===
                "player_left"
            ) {

                removePeer(
                    data.token
                );

                players.delete(
                    data.token
                );

                renderPlayers();

                return;
            }


            /*
            POSITIONS
            */

            if (
                data.type ===
                "positions"
            ) {

                for (
                    const player of
                    data.players || []
                ) {

                    players.set(
                        player.token,
                        player
                    );
                }

                renderPlayers();

                updateAudioVolumes();

                return;
            }


            /*
            SIGNAL
            */

            if (
                data.type ===
                "signal"
            ) {

                await handleSignal(
                    data.from,
                    data.signal
                );
            }
        };
}


connect();


/*
============================================================
USERNAME
============================================================
*/

function sendUsername() {

    if (
        !socket ||
        socket.readyState !==
            WebSocket.OPEN
    ) {
        return;
    }

    socket.send(
        JSON.stringify({
            type: "username",
            username: "Roblox Player"
        })
    );
}


/*
============================================================
MIC BUTTON
============================================================
*/

micButton.onclick =
    async () => {

        errorElement.textContent = "";

        if (!micEnabled) {

            await enableMic();

        } else {

            disableMic();
        }
    };


/*
============================================================
ENABLE MIC
============================================================
*/

async function enableMic() {

    try {

        microphoneStream =
            await navigator.mediaDevices
                .getUserMedia({

                    audio: {

                        echoCancellation: true,

                        noiseSuppression: true,

                        autoGainControl: true,

                        channelCount: 1,

                        sampleRate: 48000
                    }
                });


        micEnabled = true;


        micStatus.textContent =
            "المايك شغال";

        micStatus.classList.add(
            "active"
        );

        micCircle.classList.add(
            "active"
        );

        micCircle.textContent =
            "🔊";

        micButton.textContent =
            "إيقاف المايك";

        micButton.classList.add(
            "off"
        );


        sendMicState();


        /*
        Add microphone
        to existing peers.
        */

        for (
            const pc of
            peerConnections.values()
        ) {

            await addMicrophoneToPeer(
                pc
            );
        }

    } catch (error) {

        console.error(error);

        errorElement.textContent =
            "اسمح للموقع باستخدام الميكروفون أولاً.";
    }
}


/*
============================================================
DISABLE MIC
============================================================
*/

function disableMic() {

    micEnabled = false;


    if (microphoneStream) {

        for (
            const track of
            microphoneStream.getTracks()
        ) {

            track.stop();
        }

        microphoneStream = null;
    }


    micStatus.textContent =
        "المايك مقفل";

    micStatus.classList.remove(
        "active"
    );

    micCircle.classList.remove(
        "active"
    );

    micCircle.textContent =
        "🎙️";

    micButton.textContent =
        "تشغيل المايك";

    micButton.classList.remove(
        "off"
    );


    sendMicState();
}


/*
============================================================
MIC STATE
============================================================
*/

function sendMicState() {

    if (
        !socket ||
        socket.readyState !==
            WebSocket.OPEN
    ) {
        return;
    }

    socket.send(
        JSON.stringify({

            type: "mic",

            enabled:
                micEnabled
        })
    );
}


/*
============================================================
WEBRTC
============================================================
*/

async function createPeer(
    remoteToken,
    createOffer
) {

    if (
        !remoteToken ||
        remoteToken === token
    ) {
        return;
    }


    if (
        peerConnections.has(
            remoteToken
        )
    ) {

        return peerConnections.get(
            remoteToken
        );
    }


    const pc =
        new RTCPeerConnection({

            iceServers: [

                {
                    urls:
                        "stun:stun.l.google.com:19302"
                },

                {
                    urls:
                        "stun:stun1.l.google.com:19302"
                }
            ]
        });


    peerConnections.set(
        remoteToken,
        pc
    );


    /*
    MICROPHONE
    */

    if (microphoneStream) {

        for (
            const track of
            microphoneStream.getTracks()
        ) {

            pc.addTrack(
                track,
                microphoneStream
            );
        }
    }


    /*
    INCOMING AUDIO
    */

    pc.ontrack =
        event => {

            let audio =
                audioElements.get(
                    remoteToken
                );


            if (!audio) {

                audio =
                    document.createElement(
                        "audio"
                    );

                audio.autoplay = true;

                audio.playsInline = true;

                audio.style.display =
                    "none";

                document.body.appendChild(
                    audio
                );

                audioElements.set(
                    remoteToken,
                    audio
                );
            }


            if (
                event.streams &&
                event.streams[0]
            ) {

                audio.srcObject =
                    event.streams[0];

                audio.play().catch(
                    () => {}
                );
            }


            updateAudioVolume(
                remoteToken
            );
        };


    /*
    ICE
    */

    pc.onicecandidate =
        event => {

            if (!event.candidate) {
                return;
            }

            sendSignal(
                remoteToken,
                {
                    type: "candidate",
                    candidate:
                        event.candidate
                }
            );
        };


    /*
    CONNECTION
    */

    pc.onconnectionstatechange =
        () => {

            if (
                pc.connectionState ===
                    "failed" ||
                pc.connectionState ===
                    "closed"
            ) {

                removePeer(
                    remoteToken
                );
            }
        };


    /*
    OFFER
    */

    if (createOffer) {

        const offer =
            await pc.createOffer();

        await pc.setLocalDescription(
            offer
        );

        sendSignal(
            remoteToken,
            {
                type: "offer",
                offer
            }
        );
    }


    return pc;
}


/*
============================================================
ADD MICROPHONE
============================================================
*/

async function addMicrophoneToPeer(
    pc
) {

    if (!microphoneStream) {
        return;
    }


    const senders =
        pc.getSenders();


    for (
        const track of
        microphoneStream.getTracks()
    ) {

        const existing =
            senders.find(
                sender =>
                    sender.track &&
                    sender.track.kind ===
                        track.kind
            );


        if (!existing) {

            pc.addTrack(
                track,
                microphoneStream
            );
        }
    }
}


/*
============================================================
SIGNAL
============================================================
*/

function sendSignal(
    remoteToken,
    signal
) {

    if (
        !socket ||
        socket.readyState !==
            WebSocket.OPEN
    ) {
        return;
    }


    socket.send(
        JSON.stringify({

            type: "signal",

            to: remoteToken,

            signal
        })
    );
}


/*
============================================================
HANDLE SIGNAL
============================================================
*/

async function handleSignal(
    remoteToken,
    signal
) {

    const pc =
        await createPeer(
            remoteToken,
            false
        );


    if (!pc || !signal) {
        return;
    }


    if (
        signal.type ===
        "offer"
    ) {

        await pc.setRemoteDescription(
            signal.offer
        );


        if (microphoneStream) {

            for (
                const track of
                microphoneStream.getTracks()
            ) {

                const exists =
                    pc.getSenders()
                        .some(
                            sender =>
                                sender.track ===
                                track
                        );


                if (!exists) {

                    pc.addTrack(
                        track,
                        microphoneStream
                    );
                }
            }
        }


        const answer =
            await pc.createAnswer();


        await pc.setLocalDescription(
            answer
        );


        sendSignal(
            remoteToken,
            {
                type: "answer",
                answer
            }
        );

        return;
    }


    if (
        signal.type ===
        "answer"
    ) {

        try {

            await pc.setRemoteDescription(
                signal.answer
            );

        } catch {}

        return;
    }


    if (
        signal.type ===
        "candidate"
    ) {

        try {

            await pc.addIceCandidate(
                signal.candidate
            );

        } catch {}
    }
}


/*
============================================================
REMOVE PEER
============================================================
*/

function removePeer(
    remoteToken
) {

    const pc =
        peerConnections.get(
            remoteToken
        );


    if (pc) {

        try {
            pc.close();
        } catch {}

        peerConnections.delete(
            remoteToken
        );
    }


    const audio =
        audioElements.get(
            remoteToken
        );


    if (audio) {

        try {
            audio.pause();
        } catch {}

        audio.srcObject = null;

        audio.remove();

        audioElements.delete(
            remoteToken
        );
    }
}


/*
============================================================
DISTANCE
============================================================
*/

function distance(
    a,
    b
) {

    if (!a || !b) {
        return Infinity;
    }


    const dx =
        Number(a.x || 0) -
        Number(b.x || 0);

    const dy =
        Number(a.y || 0) -
        Number(b.y || 0);

    const dz =
        Number(a.z || 0) -
        Number(b.z || 0);


    return Math.sqrt(
        dx * dx +
        dy * dy +
        dz * dz
    );
}


/*
============================================================
VOLUME

30M = 0%
7M  = 100%

This is the important part.
============================================================
*/

function calculateVolume(
    d
) {

    if (
        !Number.isFinite(d)
    ) {
        return 0;
    }


    /*
    Absolutely silent
    at or beyond 30.
    */

    if (
        d >= MAX_DISTANCE
    ) {
        return 0;
    }


    /*
    Full volume
    inside 7.
    */

    if (
        d <= FULL_DISTANCE
    ) {
        return 1;
    }


    /*
    Linear falloff.
    */

    const volume =
        1 -
        (
            (d - FULL_DISTANCE) /
            (MAX_DISTANCE - FULL_DISTANCE)
        );


    return Math.max(
        0,
        Math.min(
            1,
            volume
        )
    );
}


/*
============================================================
AUDIO VOLUME
============================================================
*/

function updateAudioVolume(
    remoteToken
) {

    const audio =
        audioElements.get(
            remoteToken
        );


    if (
        !audio ||
        !localPlayer
    ) {
        return;
    }


    const player =
        players.get(
            remoteToken
        );


    if (!player) {
        audio.volume = 0;
        return;
    }


    if (
        player.muted ||
        !player.micEnabled
    ) {

        audio.volume = 0;

        return;
    }


    const d =
        distance(
            localPlayer,
            player
        );


    /*
    HARD 30M LIMIT
    */

    if (
        d >= MAX_DISTANCE
    ) {

        audio.volume = 0;

        return;
    }


    audio.volume =
        calculateVolume(d);
}


/*
============================================================
UPDATE ALL AUDIO
============================================================
*/

function updateAudioVolumes() {

    for (
        const remoteToken of
        audioElements.keys()
    ) {

        updateAudioVolume(
            remoteToken
        );
    }
}


/*
============================================================
PLAYER UI
============================================================
*/

function renderPlayers() {

    playersElement.innerHTML = "";


    if (!localPlayer) {

        playersElement.innerHTML = `
            <div class="empty">
                جاري تحميل اللاعبين...
            </div>
        `;

        return;
    }


    const nearby = [];


    for (
        const player of
        players.values()
    ) {

        if (
            player.token ===
            localPlayer.token
        ) {
            continue;
        }


        const d =
            distance(
                localPlayer,
                player
            );


        /*
        ONLY 30 METERS
        */

        if (
            d <= MAX_DISTANCE
        ) {

            nearby.push({

                player,

                distance: d
            });
        }
    }


    nearby.sort(
        (a, b) =>
            a.distance -
            b.distance
    );


    countElement.textContent =
        `${nearby.length} لاعبين`;


    if (
        nearby.length === 0
    ) {

        playersElement.innerHTML = `
            <div class="empty">
                لا يوجد لاعبين ضمن 30 متر
            </div>
        `;

        return;
    }


    for (
        const item of nearby
    ) {

        const player =
            item.player;

        const d =
            item.distance;


        const volume =
            Math.round(
                calculateVolume(d) * 100
            );


        const element =
            document.createElement(
                "div"
            );


        element.className =
            "player";


        const voice =
            player.micEnabled &&
            !player.muted &&
            volume > 0
                ? "🔊"
                : "🔇";


        element.innerHTML = `

            <div class="playerLeft">

                <div class="avatar">
                    👤
                </div>

                <div>

                    <div class="name">
                        ${escapeHTML(
                            player.username ||
                            "Player"
                        )}
                    </div>

                    <div class="distance">
                        ${d.toFixed(1)} متر
                    </div>

                </div>

            </div>

            <div class="voiceBox">

                <div class="voiceIcon">
                    ${voice}
                </div>

                <div class="volume">
                    ${volume}% صوت
                </div>

            </div>
        `;


        playersElement.appendChild(
            element
        );
    }
}


/*
============================================================
ESCAPE HTML
============================================================
*/

function escapeHTML(
    value
) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        String(value);

    return div.innerHTML;
}


/*
============================================================
CLEANUP
============================================================
*/

window.addEventListener(
    "beforeunload",
    () => {

        if (microphoneStream) {

            for (
                const track of
                microphoneStream.getTracks()
            ) {

                track.stop();
            }
        }


        for (
            const pc of
            peerConnections.values()
        ) {

            try {
                pc.close();
            } catch {}
        }
    }
);

</script>
