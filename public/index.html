<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MicBlox — Proximity Voice</title>

<style>

* {
    box-sizing: border-box;
}

:root {
    --bg: #070910;
    --panel: rgba(18, 22, 34, .82);
    --panel2: rgba(25, 30, 45, .72);
    --border: rgba(255,255,255,.09);
    --text: #f7f9ff;
    --muted: #8e97aa;
    --green: #42f59b;
    --red: #ff5266;
    --blue: #5b8cff;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {

    min-height: 100vh;

    color: var(--text);

    font-family:
        Inter,
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 50% -10%,
            #26365e 0%,
            transparent 42%
        ),
        radial-gradient(
            circle at 0% 100%,
            #142d32 0%,
            transparent 35%
        ),
        var(--bg);

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 25px;

    overflow-x: hidden;
}

body::before {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    background:
        linear-gradient(
            120deg,
            transparent,
            rgba(255,255,255,.025),
            transparent
        );

    opacity: .7;
}

.container {

    width: 470px;

    max-width: 100%;

    padding: 25px;

    border:
        1px solid
        var(--border);

    border-radius: 28px;

    background:
        linear-gradient(
            145deg,
            rgba(24,29,44,.92),
            rgba(9,12,20,.94)
        );

    box-shadow:
        0 35px 100px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.04);

    backdrop-filter: blur(25px);
}

.header {

    text-align: center;

    margin-bottom: 22px;
}

.logo {

    font-size: 34px;

    font-weight: 900;

    letter-spacing: -1px;
}

.logo span {
    color: var(--green);
}

.subtitle {

    margin-top: 7px;

    color: var(--muted);

    font-size: 13px;
}

.micBox {

    position: relative;

    overflow: hidden;

    padding: 28px 22px;

    border-radius: 23px;

    border:
        1px solid
        var(--border);

    background:
        linear-gradient(
            145deg,
            rgba(34,40,57,.72),
            rgba(17,21,31,.8)
        );

    text-align: center;
}

.micBox::before {

    content: "";

    position: absolute;

    width: 180px;
    height: 180px;

    border-radius: 50%;

    background:
        rgba(66,245,155,.06);

    filter: blur(20px);

    top: -100px;
    left: 50%;

    transform:
        translateX(-50%);
}

.micCircle {

    position: relative;

    width: 105px;
    height: 105px;

    margin: auto;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 42px;

    background:
        linear-gradient(
            145deg,
            #252c3d,
            #151a26
        );

    border:
        1px solid
        rgba(255,255,255,.08);

    box-shadow:
        0 20px 50px rgba(0,0,0,.35);

    transition:
        .25s ease;
}

.micCircle.active {

    background:
        radial-gradient(
            circle,
            rgba(66,245,155,.28),
            rgba(66,245,155,.06)
        );

    border-color:
        rgba(66,245,155,.4);

    box-shadow:
        0 0 0 10px rgba(66,245,155,.04),
        0 0 55px rgba(66,245,155,.25);
}

.status {

    position: relative;

    margin-top: 17px;

    color: var(--red);

    font-weight: 700;

    font-size: 15px;
}

.status.active {
    color: var(--green);
}

#micButton {

    position: relative;

    width: 100%;

    margin-top: 17px;

    padding: 15px;

    border: 0;

    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            #55ffad,
            #25d87d
        );

    color: #04150d;

    font-size: 16px;

    font-weight: 900;

    cursor: pointer;

    transition: .2s;

    box-shadow:
        0 12px 30px rgba(66,245,155,.16);
}

#micButton:hover {
    transform: translateY(-2px);
}

#micButton:active {
    transform: scale(.98);
}

#micButton.off {

    background:
        linear-gradient(
            135deg,
            #ff6476,
            #e33d50
        );

    color: white;

    box-shadow:
        0 12px 30px rgba(255,82,102,.14);
}

.error {

    margin-top: 12px;

    color: var(--red);

    font-size: 12px;
}

.section {

    margin-top: 20px;
}

.sectionHeader {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 10px;
}

.sectionHeader b {
    font-size: 15px;
}

.range {

    color: var(--muted);

    font-size: 12px;
}

.players {

    display: flex;

    flex-direction: column;

    gap: 9px;

    max-height: 330px;

    overflow-y: auto;

    padding-right: 2px;
}

.player {

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 13px;

    border-radius: 15px;

    border:
        1px solid
        rgba(255,255,255,.055);

    background:
        rgba(22,27,39,.78);

    transition: .2s;
}

.player:hover {

    transform: translateY(-1px);

    background:
        rgba(30,36,52,.9);
}

.playerLeft {

    display: flex;

    align-items: center;

    gap: 11px;
}

.avatar {

    width: 43px;
    height: 43px;

    border-radius: 13px;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            145deg,
            #30394d,
            #1c2331
        );

    font-size: 20px;
}

.name {
    font-weight: 800;
}

.distance {

    margin-top: 4px;

    color: var(--muted);

    font-size: 11px;
}

.voice {

    width: 36px;
    height: 36px;

    border-radius: 11px;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        rgba(255,255,255,.05);
}

.empty {

    padding: 27px;

    text-align: center;

    color: var(--muted);

    border-radius: 15px;

    background:
        rgba(22,27,39,.65);

    border:
        1px dashed
        rgba(255,255,255,.08);
}

.connection {

    margin-top: 17px;

    text-align: center;

    color: var(--muted);

    font-size: 12px;
}

.online {
    color: var(--green);
}

.offline {
    color: var(--red);
}

::-webkit-scrollbar {
    width: 4px;
}

::-webkit-scrollbar-thumb {
    background: #3a4255;
    border-radius: 20px;
}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">
            🎙️ Mic<span>Blox</span>
        </div>

        <div class="subtitle">
            Proximity Voice System
        </div>

    </div>

    <div class="micBox">

        <div
            id="micCircle"
            class="micCircle"
        >
            🎙️
        </div>

        <div
            id="micStatus"
            class="status"
        >
            المايك مقفل
        </div>

        <button id="micButton">
            تشغيل المايك
        </button>

        <div
            id="error"
            class="error"
        ></div>

    </div>

    <div class="section">

        <div class="sectionHeader">

            <b>
                اللاعبين القريبين
            </b>

            <span
                id="range"
                class="range"
            >
                مدى الصوت: 30 متر
            </span>

        </div>

        <div
            id="players"
            class="players"
        >

            <div class="empty">
                جاري الاتصال...
            </div>

        </div>

    </div>

    <div class="connection">

        ●

        <span
            id="connection"
            class="offline"
        >
            جاري الاتصال...
        </span>

    </div>

</div>

<script>

"use strict";

/* =========================================================
   TOKEN
========================================================= */

const token =
    location.pathname
        .split("/")
        .filter(Boolean)[0];

if (!token) {

    document.body.innerHTML = `
        <div style="
            color:white;
            font-family:Arial;
            text-align:center;
            padding:40px;
        ">
            الرابط غير صالح
        </div>
    `;

    throw new Error("Missing token");
}

/* =========================================================
   ELEMENTS
========================================================= */

const micButton =
    document.getElementById("micButton");

const micStatus =
    document.getElementById("micStatus");

const micCircle =
    document.getElementById("micCircle");

const playersElement =
    document.getElementById("players");

const connectionElement =
    document.getElementById("connection");

const errorElement =
    document.getElementById("error");

const rangeElement =
    document.getElementById("range");

/* =========================================================
   STATE
========================================================= */

let socket = null;

let localPlayer = null;

const players = new Map();

const peerConnections = new Map();

const audioElements = new Map();

let microphoneStream = null;

let micEnabled = false;

let maxDistance = 30;

let fullDistance = 7;

let reconnectTimer = null;

/* =========================================================
   WEBSOCKET
========================================================= */

function connect() {

    if (
        socket &&
        (
            socket.readyState === WebSocket.OPEN ||
            socket.readyState === WebSocket.CONNECTING
        )
    ) {
        return;
    }

    const protocol =
        location.protocol === "https:"
            ? "wss:"
            : "ws:";

    socket =
        new WebSocket(
            `${protocol}//${location.host}/ws?token=${encodeURIComponent(token)}`
        );

    socket.onopen = () => {

        connectionElement.textContent =
            "متصل";

        connectionElement.className =
            "online";

        clearTimeout(reconnectTimer);

        sendUsername();

        if (micEnabled) {
            sendMicState();
        }
    };

    socket.onclose = () => {

        connectionElement.textContent =
            "انقطع الاتصال";

        connectionElement.className =
            "offline";

        reconnectTimer =
            setTimeout(
                connect,
                2000
            );
    };

    socket.onerror = () => {

        connectionElement.textContent =
            "خطأ في الاتصال";

        connectionElement.className =
            "offline";
    };

    socket.onmessage =
        async event => {

            let data;

            try {
                data =
                    JSON.parse(
                        event.data
                    );
            } catch {
                return;
            }

            if (
                data.type ===
                "connected"
            ) {

                localPlayer =
                    data.player;

                maxDistance =
                    Number(
                        data.maxDistance
                    ) || 30;

                fullDistance =
                    Number(
                        data.fullDistance
                    ) || 7;

                players.set(
                    localPlayer.token,
                    localPlayer
                );

                updateRange();

                renderPlayers();

                return;
            }

            if (
                data.type ===
                "peers"
            ) {

                for (
                    const player of
                    data.players || []
                ) {

                    players.set(
                        player.token,
                        player
                    );

                    await createPeer(
                        player.token,
                        true
                    );
                }

                renderPlayers();

                return;
            }

            if (
                data.type ===
                "player_joined"
            ) {

                if (!data.player) {
                    return;
                }

                players.set(
                    data.player.token,
                    data.player
                );

                renderPlayers();

                return;
            }

            if (
                data.type ===
                "player_update"
            ) {

                if (!data.player) {
                    return;
                }

                players.set(
                    data.player.token,
                    data.player
                );

                renderPlayers();

                updateAudioVolumes();

                return;
            }

            if (
                data.type ===
                "player_left"
            ) {

                removePeer(
                    data.token
                );

                players.delete(
                    data.token
                );

                renderPlayers();

                return;
            }

            if (
                data.type ===
                "positions"
            ) {

                maxDistance =
                    Number(
                        data.maxDistance
                    ) || 30;

                fullDistance =
                    Number(
                        data.fullDistance
                    ) || 7;

                for (
                    const player of
                    data.players || []
                ) {

                    players.set(
                        player.token,
                        player
                    );
                }

                updateRange();

                renderPlayers();

                updateAudioVolumes();

                return;
            }

            if (
                data.type ===
                "signal"
            ) {

                await handleSignal(
                    data.from,
                    data.signal
                );
            }
        };
}

connect();

/* =========================================================
   RANGE
========================================================= */

function updateRange() {

    rangeElement.textContent =
        `مدى الصوت: ${maxDistance} متر`;
}

/* =========================================================
   USERNAME
========================================================= */

function sendUsername() {

    if (
        !socket ||
        socket.readyState !==
            WebSocket.OPEN
    ) {
        return;
    }

    socket.send(
        JSON.stringify({
            type: "username",
            username: "Roblox Player"
        })
    );
}

/* =========================================================
   MIC BUTTON
========================================================= */

micButton.onclick =
    async () => {

        errorElement.textContent = "";

        if (micEnabled) {

            disableMic();

        } else {

            await enableMic();
        }
    };

/* =========================================================
   ENABLE MIC
========================================================= */

async function enableMic() {

    try {

        microphoneStream =
            await navigator.mediaDevices
                .getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true,
                        channelCount: 1,
                        sampleRate: 48000
                    }
                });

        micEnabled = true;

        micStatus.textContent =
            "المايك شغال";

        micStatus.classList.add(
            "active"
        );

        micCircle.classList.add(
            "active"
        );

        micCircle.textContent =
            "🔊";

        micButton.textContent =
            "إيقاف المايك";

        micButton.classList.add(
            "off"
        );

        sendMicState();

        for (
            const pc of
            peerConnections.values()
        ) {

            await addMicrophoneToPeer(
                pc
            );
        }

    } catch (error) {

        console.error(error);

        errorElement.textContent =
            "اسمح للمتصفح باستخدام الميكروفون أولاً.";
    }
}

/* =========================================================
   DISABLE MIC
========================================================= */

function disableMic() {

    micEnabled = false;

    if (microphoneStream) {

        for (
            const track of
            microphoneStream.getTracks()
        ) {

            track.stop();
        }

        microphoneStream = null;
    }

    micStatus.textContent =
        "المايك مقفل";

    micStatus.classList.remove(
        "active"
    );

    micCircle.classList.remove(
        "active"
    );

    micCircle.textContent =
        "🎙️";

    micButton.textContent =
        "تشغيل المايك";

    micButton.classList.remove(
        "off"
    );

    sendMicState();
}

/* =========================================================
   MIC STATE
========================================================= */

function sendMicState() {

    if (
        !socket ||
        socket.readyState !==
            WebSocket.OPEN
    ) {
        return;
    }

    socket.send(
        JSON.stringify({
            type: "mic",
            enabled: micEnabled
        })
    );
}

/* =========================================================
   WEBRTC
========================================================= */

async function createPeer(
    remoteToken,
    createOffer
) {

    if (
        !remoteToken ||
        remoteToken === token
    ) {
        return null;
    }

    if (
        peerConnections.has(
            remoteToken
        )
    ) {

        return peerConnections.get(
            remoteToken
        );
    }

    const pc =
        new RTCPeerConnection({
            iceServers: [
                {
                    urls:
                        "stun:stun.l.google.com:19302"
                },
                {
                    urls:
                        "stun:stun1.l.google.com:19302"
                }
            ]
        });

    peerConnections.set(
        remoteToken,
        pc
    );

    if (microphoneStream) {

        for (
            const track of
            microphoneStream.getTracks()
        ) {

            pc.addTrack(
                track,
                microphoneStream
            );
        }
    }

    pc.ontrack =
        event => {

            let audio =
                audioElements.get(
                    remoteToken
                );

            if (!audio) {

                audio =
                    document.createElement(
                        "audio"
                    );

                audio.autoplay = true;

                audio.playsInline = true;

                audio.setAttribute(
                    "playsinline",
                    ""
                );

                document.body.appendChild(
                    audio
                );

                audioElements.set(
                    remoteToken,
                    audio
                );
            }

            if (
                event.streams &&
                event.streams[0]
            ) {

                audio.srcObject =
                    event.streams[0];

                audio.play().catch(() => {});
            }

            updateAudioVolume(
                remoteToken
            );
        };

    pc.onicecandidate =
        event => {

            if (!event.candidate) {
                return;
            }

            sendSignal(
                remoteToken,
                {
                    type: "candidate",
                    candidate:
                        event.candidate
                }
            );
        };

    pc.onconnectionstatechange =
        () => {

            if (
                pc.connectionState ===
                    "failed" ||
                pc.connectionState ===
                    "closed"
            ) {

                removePeer(
                    remoteToken
                );
            }
        };

    if (createOffer) {

        try {

            const offer =
                await pc.createOffer();

            await pc.setLocalDescription(
                offer
            );

            sendSignal(
                remoteToken,
                {
                    type: "offer",
                    offer
                }
            );

        } catch (error) {

            console.error(
                "Offer error:",
                error
            );
        }
    }

    return pc;
}

/* =========================================================
   ADD MICROPHONE
========================================================= */

async function addMicrophoneToPeer(
    pc
) {

    if (!microphoneStream) {
        return;
    }

    const senders =
        pc.getSenders();

    for (
        const track of
        microphoneStream.getTracks()
    ) {

        const existing =
            senders.find(
                sender =>
                    sender.track &&
                    sender.track.kind ===
                        track.kind
            );

        if (!existing) {

            pc.addTrack(
                track,
                microphoneStream
            );
        }
    }
}

/* =========================================================
   SIGNAL
========================================================= */

function sendSignal(
    remoteToken,
    signal
) {

    if (
        !socket ||
        socket.readyState !==
            WebSocket.OPEN
    ) {
        return;
    }

    socket.send(
        JSON.stringify({
            type: "signal",
            to: remoteToken,
            signal
        })
    );
}

/* =========================================================
   HANDLE SIGNAL
========================================================= */

async function handleSignal(
    remoteToken,
    signal
) {

    const pc =
        await createPeer(
            remoteToken,
            false
        );

    if (!pc || !signal) {
        return;
    }

    try {

        if (
            signal.type ===
            "offer"
        ) {

            await pc.setRemoteDescription(
                signal.offer
            );

            if (microphoneStream) {

                for (
                    const track of
                    microphoneStream.getTracks()
                ) {

                    const exists =
                        pc.getSenders()
                            .some(
                                sender =>
                                    sender.track ===
                                    track
                            );

                    if (!exists) {

                        pc.addTrack(
                            track,
                            microphoneStream
                        );
                    }
                }
            }

            const answer =
                await pc.createAnswer();

            await pc.setLocalDescription(
                answer
            );

            sendSignal(
                remoteToken,
                {
                    type: "answer",
                    answer
                }
            );

            return;
        }

        if (
            signal.type ===
            "answer"
        ) {

            await pc.setRemoteDescription(
                signal.answer
            );

            return;
        }

        if (
            signal.type ===
            "candidate"
        ) {

            await pc.addIceCandidate(
                signal.candidate
            );
        }

    } catch (error) {

        console.error(
            "WebRTC error:",
            error
        );
    }
}

/* =========================================================
   REMOVE PEER
========================================================= */

function removePeer(
    remoteToken
) {

    const pc =
        peerConnections.get(
            remoteToken
        );

    if (pc) {

        try {
            pc.close();
        } catch {}

        peerConnections.delete(
            remoteToken
        );
    }

    const audio =
        audioElements.get(
            remoteToken
        );

    if (audio) {

        try {
            audio.pause();
        } catch {}

        audio.srcObject = null;

        audio.remove();

        audioElements.delete(
            remoteToken
        );
    }
}

/* =========================================================
   DISTANCE
========================================================= */

function distance(a, b) {

    if (!a || !b) {
        return Infinity;
    }

    const dx =
        (Number(a.x) || 0) -
        (Number(b.x) || 0);

    const dy =
        (Number(a.y) || 0) -
        (Number(b.y) || 0);

    const dz =
        (Number(a.z) || 0) -
        (Number(b.z) || 0);

    return Math.sqrt(
        dx * dx +
        dy * dy +
        dz * dz
    );
}

/* =========================================================
   AUDIO VOLUME
========================================================= */

function updateAudioVolume(
    remoteToken
) {

    const audio =
        audioElements.get(
            remoteToken
        );

    if (!audio || !localPlayer) {
        return;
    }

    const player =
        players.get(
            remoteToken
        );

    if (!player) {
        audio.volume = 0;
        return;
    }

    const d =
        distance(
            localPlayer,
            player
        );

    /*
       HARD 30M LIMIT
    */

    if (
        d >= maxDistance ||
        !player.micEnabled ||
        player.muted
    ) {

        audio.volume = 0;

        return;
    }

    /*
       FULL VOLUME
       <= 7m
    */

    if (
        d <= fullDistance
    ) {

        audio.volume = 1;

        return;
    }

    /*
       LINEAR FALLOFF
    */

    const volume =
        1 -
        (
            (d - fullDistance) /
            (maxDistance - fullDistance)
        );

    audio.volume =
        Math.max(
            0,
            Math.min(
                1,
                volume
            )
        );
}

/* =========================================================
   UPDATE AUDIO
========================================================= */

function updateAudioVolumes() {

    for (
        const remoteToken of
        audioElements.keys()
    ) {

        updateAudioVolume(
            remoteToken
        );
    }
}

/* =========================================================
   UI
========================================================= */

function renderPlayers() {

    playersElement.innerHTML = "";

    if (!localPlayer) {

        playersElement.innerHTML = `
            <div class="empty">
                جاري تحميل اللاعبين...
            </div>
        `;

        return;
    }

    const nearby = [];

    for (
        const player of
        players.values()
    ) {

        if (
            player.token ===
            localPlayer.token
        ) {
            continue;
        }

        const d =
            distance(
                localPlayer,
                player
            );

        /*
           ONLY 30 METERS
        */

        if (
            d <= maxDistance
        ) {

            nearby.push({
                player,
                distance: d
            });
        }
    }

    nearby.sort(
        (a, b) =>
            a.distance -
            b.distance
    );

    if (
        nearby.length === 0
    ) {

        playersElement.innerHTML = `
            <div class="empty">
                لا يوجد لاعبين ضمن ${maxDistance} متر
            </div>
        `;

        return;
    }

    for (
        const item of nearby
    ) {

        const player =
            item.player;

        const element =
            document.createElement(
                "div"
            );

        element.className =
            "player";

        const voice =
            player.micEnabled &&
            !player.muted &&
            item.distance < maxDistance
                ? "🔊"
                : "🔇";

        element.innerHTML = `

            <div class="playerLeft">

                <div class="avatar">
                    👤
                </div>

                <div>

                    <div class="name">
                        ${escapeHTML(
                            player.username ||
                            "Player"
                        )}
                    </div>

                    <div class="distance">
                        ${item.distance.toFixed(1)}
                        متر
                    </div>

                </div>

            </div>

            <div class="voice">
                ${voice}
            </div>
        `;

        playersElement.appendChild(
            element
        );
    }
}

/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        String(value);

    return div.innerHTML;
}

/* =========================================================
   UPDATE DISTANCE CONSTANTLY
========================================================= */

setInterval(
    () => {

        if (!localPlayer) {
            return;
        }

        updateAudioVolumes();

        renderPlayers();

    },
    250
);

/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        if (microphoneStream) {

            for (
                const track of
                microphoneStream.getTracks()
            ) {

                track.stop();
            }
        }

        for (
            const pc of
            peerConnections.values()
        ) {

            try {
                pc.close();
            } catch {}
        }
    }
);

</script>
